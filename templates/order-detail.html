<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details - MediStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <!-- Header/Navigation -->
  <header class="header" id="main-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="fas fa-pills"></i></div>
          <span class="logo-text">MediStore</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- Breadcrumb -->
    <section class="breadcrumb">
      <div class="container">
        <a href="index.html">Home</a> / <a href="dashboard.html">Dashboard</a> / <span>Order Details</span>
      </div>
    </section>

    <div class="container">
      <div id="orderContent" style="margin-top: 40px; margin-bottom: 80px;">
        <!-- Loaded by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-col">
          <h4>About MediStore</h4>
          <p>Your trusted online pharmacy for quality medicines and healthcare products.</p>
        </div>
        <div class="footer-col">
          <h4>Quick Links</h4>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Contact Info</h4>
          <p><i class="fas fa-phone"></i> +91-XXXXX-XXXXX</p>
          <p><i class="fas fa-envelope"></i> support@medistore.com</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 MediStore. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/init.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      setupThemeToggle();
      setupMobileMenu();
      checkAuth();

      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id') || params.get('order_id');

      if (!orderId) {
        renderError('Order ID is missing.');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/orders/${orderId}/`, {
          headers: getAuthHeader()
        });

        if (!response.ok) {
          throw new Error('Order not found');
        }

        const order = await response.json();
        displayOrderDetail(order);
      } catch (error) {
        reportClientError('Error loading order', error, 'Unable to load order details.');
        renderError('Unable to load order details.');
      }
    });

    function renderError(message) {
      document.getElementById('orderContent').innerHTML = `
        <div style="text-align: center; padding: 40px 0;">
          <h3>${message}</h3>
          <a href="dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        </div>
      `;
    }

    function displayOrderDetail(order) {
      const timeline = [
        { key: 'placed', label: 'Order Placed' },
        { key: 'confirmed', label: 'Confirmed' },
        { key: 'shipped', label: 'Shipped' },
        { key: 'delivered', label: 'Delivered' }
      ];
      const currentIndex = timeline.findIndex(step => step.key === order.status);

      const statusHtml = timeline.map((step, idx) => {
        const done = idx <= currentIndex;
        return `<span style="display:inline-block; margin-right:8px; padding:6px 10px; border-radius:999px; background:${done ? 'var(--primary)' : 'var(--bg-gray)'}; color:${done ? '#fff' : 'var(--text-dark)'};">${step.label}</span>`;
      }).join('');

      const itemsHtml = (order.items || []).map(item => `
        <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);">
          <div>
            <strong>${item.product ? item.product.name : 'Product'}</strong>
            <p style="margin:4px 0; color:var(--text-light);">Qty: ${item.quantity}</p>
          </div>
          <div>₹${item.final_price || item.price}</div>
        </div>
      `).join('') || '<p>No items found.</p>';

      document.getElementById('orderContent').innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 320px; gap:24px;">
          <div>
            <div class="summary-card" style="margin-bottom:16px;">
              <h1 style="margin:0 0 8px;">Order #${order.id}</h1>
              <p style="margin:0; color:var(--text-light);">Placed at: ${formatDate(order.placed_at)}</p>
            </div>

            <div class="summary-card" style="margin-bottom:16px;">
              <h3 style="margin-top:0;">Status</h3>
              <div>${statusHtml}</div>
            </div>

            <div class="summary-card">
              <h3 style="margin-top:0;">Items</h3>
              ${itemsHtml}
            </div>
          </div>

          <aside class="summary-card">
            <h3 style="margin-top:0;">Summary</h3>
            <p><strong>Subtotal:</strong> ₹${order.subtotal}</p>
            <p><strong>Tax:</strong> ₹${order.tax}</p>
            <p><strong>Shipping:</strong> ₹${order.shipping_charges}</p>
            ${order.coupon_discount ? `<p><strong>Coupon Discount:</strong> -₹${order.coupon_discount}</p>` : ''}
            <p style="font-size:1.1rem;"><strong>Total:</strong> ₹${order.total_amount}</p>

            <h4>Delivery Address</h4>
            <p style="margin:0;">
              ${order.address ? order.address.full_name : ''}<br>
              ${order.address ? order.address.address_line_1 : ''}<br>
              ${order.address ? order.address.city + ', ' + order.address.state + ' ' + order.address.postal_code : ''}<br>
              ${order.address ? order.address.phone : ''}
            </p>

            ${['placed','confirmed'].includes(order.status) ? `<button onclick="cancelOrder(${order.id})" class="btn btn-outline" style="width:100%; margin-top:16px; color:var(--danger); border-color:var(--danger);">Cancel Order</button>` : ''}
          </aside>
        </div>
      `;
    }

    async function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      try {
        const response = await fetch(`${API_BASE_URL}/orders/${orderId}/update_status/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...getAuthHeader()
          },
          body: JSON.stringify({ status: 'cancelled' })
        });
        
        if (response.ok) {
          alert('Order cancelled successfully');
          window.location.reload();
        } else {
          const data = await response.json();
          alert(data.error || 'Failed to cancel order');
        }
      } catch (error) {
        reportClientError('Error cancelling order', error, 'Unable to cancel order.');
        alert('An error occurred. Please try again.');
      }
    }
  </script>
</body>
</html>
